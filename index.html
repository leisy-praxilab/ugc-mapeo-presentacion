<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mapeo Simuladores UGC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@500;600;700;800&family=Merriweather+Sans:wght@400;600;700&display=swap">
<style>
/* Layout: lienzo 16:9 (1600×900) escalado a la pantalla. Manual de marca Simuladores de Negocios Colombia: azul #0caae3 y #0c71b8, grises #cdcbcb / #989898 / #7f8080, League Spartan en títulos, Merriweather Sans en textos. Firma visual: franja lateral con título vertical, semicírculos y patrón de medias lunas. Un solo tema claro, pensado para proyectar. */
:root{
  --cyan:#0CAAE3; --blue:#0C71B8; --g1:#CDCBCB; --g2:#989898; --g3:#7F8080;
  --ink:#333637; --white:#FFFFFF; --soft:#F2F2F2; --tint:#E3F5FC;
  --f-title:"League Spartan", "Arial", system-ui, sans-serif;
  --f-text:"Merriweather Sans", "Segoe UI", system-ui, sans-serif;
  --u:1px; color-scheme:light;
}
html,body{height:100%}
body{margin:0; background:#E6E6E6; color:var(--ink); font-family:var(--f-text); overflow:hidden}
h1,h2,h3,p{margin:0}
h1,h2,h3{font-family:var(--f-title); font-weight:700; text-wrap:balance; letter-spacing:0}

.viewport{position:fixed; inset:0; display:grid; place-items:center}
.stage{width:1840px; height:1035px; position:relative; transform-origin:center; flex:none}
.slide{position:absolute; inset:0; background:var(--white); overflow:hidden; display:none; box-sizing:border-box; font-size:calc(var(--u)*27); line-height:1.5}
.slide.on{display:flex; animation:in .4s ease both}
@keyframes in{from{transform:translateX(16px)}to{transform:none}}
@media (prefers-reduced-motion:reduce){.slide.on{animation:none}}

/* Franja lateral con título vertical (firma del manual) */
.rail{width:calc(var(--u)*90); flex:none; display:flex; align-items:flex-end; justify-content:center; padding:calc(var(--u)*70) 0; box-sizing:border-box; border-right:1px solid var(--g1); position:relative}
.rail::before{content:""; position:absolute; top:0; left:0; width:calc(var(--u)*10); height:calc(var(--u)*180); background:var(--bar)}
.rail span{writing-mode:vertical-rl; transform:rotate(180deg); font:600 calc(var(--u)*20)/1 var(--f-title); letter-spacing:.3em; text-transform:uppercase; white-space:nowrap; color:var(--g3)}
.rail.c{--bar:var(--cyan)} .rail.b{--bar:var(--blue)} .rail.g{--bar:var(--g2)}
.body{flex:1; min-width:0; padding:calc(var(--u)*54) calc(var(--u)*80) calc(var(--u)*54) calc(var(--u)*80); display:flex; flex-direction:column; justify-content:center; gap:calc(var(--u)*26); position:relative; box-sizing:border-box}
.folio{position:absolute; bottom:calc(var(--u)*26); right:calc(var(--u)*40); font:600 calc(var(--u)*20)/1 var(--f-title); color:var(--g3)}

.kicker{font:600 calc(var(--u)*21)/1 var(--f-title); letter-spacing:.24em; text-transform:uppercase; color:var(--cyan)}
.title{font-size:calc(var(--u)*60); font-weight:600; line-height:1.08; letter-spacing:-.01em; color:var(--ink); max-width:22em}
.title em{font-style:normal; color:var(--blue)}
.lead{font-size:calc(var(--u)*30); color:var(--g3); max-width:32em}

/* Patrón de medias lunas (página 7 del manual) */
.waves{background-image:url("data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 width=%27120%27 height=%27120%27 viewBox=%270 0 120 120%27%3E%3Cpath d=%27M20 60a30 30 0 0 1 60 0z%27 fill=%27%230CAAE3%27/%3E%3Cpath d=%27M40 60a30 30 0 0 0 60 0z%27 fill=%27%230C71B8%27/%3E%3C/svg%3E"); background-size:calc(var(--u)*120) calc(var(--u)*120)}
.half{position:absolute; border-radius:50% 50% 0 0}

/* Portada */
.s-cover{background:var(--blue); color:var(--white)}
.cover-l{flex:1; padding:calc(var(--u)*80) calc(var(--u)*90); display:flex; flex-direction:column; gap:calc(var(--u)*34); position:relative; z-index:1}
.cover-l img{height:calc(var(--u)*120); width:auto; align-self:flex-start}
.cover-l .kicker{color:var(--white); opacity:.85}
.cover-l h1{font-size:calc(var(--u)*86); font-weight:600; line-height:1.02; letter-spacing:-.01em}
.cover-l h1 span{display:block; font-family:var(--f-text); font-weight:400; font-size:.36em; letter-spacing:0; margin-top:calc(var(--u)*22); opacity:.9}
.cover-r{width:calc(var(--u)*360); flex:none; background-color:var(--white)}
.cover-nums{display:flex; gap:0; margin-top:auto}
.cover-nums div{padding:0 calc(var(--u)*34); border-left:2px solid rgba(255,255,255,.4); display:grid; gap:4px}
.cover-nums div:first-child{padding-left:0; border-left:0}
.cover-nums b{font:500 calc(var(--u)*64)/1 var(--f-title)}
.cover-nums span{font-size:calc(var(--u)*21); opacity:.9}

/* Divisores de sección: blancos, título horizontal, filete fino */
.s-div{background:var(--white); color:var(--ink)}
.s-div.c{--accent:var(--cyan)} .s-div.b{--accent:var(--blue)} .s-div.g{--accent:var(--g1)}
.div-in{flex:1; display:flex; flex-direction:column; justify-content:center; gap:calc(var(--u)*28); padding:0 calc(var(--u)*140); position:relative; z-index:1; max-width:calc(var(--u)*1050)}
.div-in h2{font:600 calc(var(--u)*92)/1.02 var(--f-title); letter-spacing:-.01em; color:var(--blue)}
.div-in .rule{width:calc(var(--u)*120); height:3px; background:var(--cyan)}
.div-in p{font-size:calc(var(--u)*30); color:var(--g3); max-width:26em; line-height:1.55}
.div-in .n{font:600 calc(var(--u)*22)/1 var(--f-title); letter-spacing:.24em; text-transform:uppercase; color:var(--g3)}

/* Cifras */
.figs{display:grid; grid-template-columns:repeat(4,1fr); gap:calc(var(--u)*40); margin-top:calc(var(--u)*14)}
.figs div{padding-top:calc(var(--u)*24); border-top:1px solid var(--g2); display:grid; gap:calc(var(--u)*8); align-content:start}
.figs b{font:500 calc(var(--u)*112)/1 var(--f-title); color:var(--blue)}
.figs div:nth-child(2) b{color:var(--cyan)} .figs div:nth-child(3) b{color:var(--g2)}
.figs strong{font:600 calc(var(--u)*28)/1.1 var(--f-title)}
.figs span{font-size:calc(var(--u)*23); color:var(--g3)}

.imgbox{flex:1; min-height:0; display:grid; place-items:center}
.imgbox img{max-width:100%; max-height:100%; display:block}

/* Siete */
.seven{display:grid; grid-template-columns:repeat(4,1fr); gap:calc(var(--u)*16); margin-top:calc(var(--u)*14)}
.tile{color:var(--ink); background:var(--white); border-top:6px solid var(--bar); box-shadow:0 1px 0 var(--g1), 0 10px 30px rgba(12,113,184,.08); padding:calc(var(--u)*26); min-height:calc(var(--u)*170); display:flex; flex-direction:column; justify-content:space-between; gap:12px; cursor:pointer; text-decoration:none; position:relative; overflow:hidden; transition:transform .2s}
.tile:hover,.tile:focus-visible{transform:translateY(-4px); outline:none}
.tile:focus-visible{box-shadow:0 0 0 4px var(--ink)}
.tile.e{--bar:var(--cyan)} .tile.c{--bar:var(--blue)}
.tile .f{font:600 calc(var(--u)*18)/1.2 var(--f-title); letter-spacing:.16em; text-transform:uppercase; color:var(--g3)}
.tile .n{font:600 calc(var(--u)*36)/1.05 var(--f-title); color:var(--blue)}
.tile.sum{--bar:var(--g1); background:var(--soft); box-shadow:none; cursor:default}
.tile.sum .n{color:var(--blue)}
.key{display:flex; gap:calc(var(--u)*36); font:600 calc(var(--u)*22)/1 var(--f-title); letter-spacing:.08em; text-transform:uppercase}
.key span{display:flex; align-items:center; gap:12px}
.key i{width:calc(var(--u)*36); height:calc(var(--u)*18); border-radius:calc(var(--u)*18) calc(var(--u)*18) 0 0; display:inline-block}

/* Simulador */
.sim-l{width:calc(var(--u)*640); flex:none; color:var(--white); padding:calc(var(--u)*70) calc(var(--u)*70); display:flex; flex-direction:column; gap:calc(var(--u)*26); position:relative; overflow:hidden; box-sizing:border-box}
.sim-l.e{background:var(--blue)} .sim-l.c{background:var(--blue)}
.sim-l .kicker{color:var(--white); opacity:.9}
.sim-l h2{font-size:calc(var(--u)*74); font-weight:600; line-height:1; letter-spacing:-.01em; position:relative; z-index:1}
.meter{margin-top:auto; display:grid; gap:calc(var(--u)*14); position:relative; z-index:1}
.meter .lab{font:600 calc(var(--u)*22)/1 var(--f-title); letter-spacing:.1em; text-transform:uppercase}
.meter-bar{display:grid; grid-template-columns:repeat(7,1fr); gap:calc(var(--u)*8); align-items:end}
.meter-bar span{height:calc(var(--u)*34); border-radius:calc(var(--u)*34) calc(var(--u)*34) 0 0; background:rgba(255,255,255,.25); display:grid; place-items:end center; padding-bottom:4px; font:700 calc(var(--u)*20)/1 var(--f-title); color:rgba(255,255,255,.8)}
.meter-bar span.on{background:var(--white); color:var(--ink)}
.badge{align-self:flex-start; background:var(--white); color:var(--blue); font:700 calc(var(--u)*26)/1 var(--f-title); letter-spacing:.1em; text-transform:uppercase; padding:calc(var(--u)*16) calc(var(--u)*26)}
.sim-r{flex:1; min-width:0; padding:calc(var(--u)*54) calc(var(--u)*80) calc(var(--u)*54) calc(var(--u)*70); display:flex; flex-direction:column; justify-content:center; gap:calc(var(--u)*18); position:relative; box-sizing:border-box}
.lbl{font:700 calc(var(--u)*21)/1 var(--f-title); letter-spacing:.14em; text-transform:uppercase; color:var(--cyan)}
.what{font-size:calc(var(--u)*28); font-weight:600; line-height:1.4}
.ev{font-size:calc(var(--u)*26); color:var(--g3); margin-bottom:calc(var(--u)*8)}
.steps{list-style:none; margin:0; padding:0; display:grid; gap:0; counter-reset:st; border-top:1px solid var(--g2)}
.steps li{counter-increment:st; display:grid; grid-template-columns:calc(var(--u)*64) 1fr; align-items:baseline; padding:calc(var(--u)*16) 0; border-bottom:1px solid var(--g1); font-size:calc(var(--u)*26); line-height:1.4}
.steps li::before{content:counter(st,decimal-leading-zero); font:500 calc(var(--u)*30)/1 var(--f-title); color:var(--cyan)}
.evline{margin-top:calc(var(--u)*14); display:grid; gap:calc(var(--u)*10); padding-left:calc(var(--u)*24); border-left:3px solid var(--blue)}
.evline .ev{margin:0}
.fits{display:grid; gap:0; border-top:1px solid var(--g2)}
.fit{display:grid; grid-template-columns:calc(var(--u)*92) 1fr auto; gap:calc(var(--u)*18); align-items:center; padding:calc(var(--u)*13) 0; border-bottom:1px solid var(--g1)}
.fit .sem{font:700 calc(var(--u)*24)/1 var(--f-title); color:var(--blue)}
.fit b{display:block; font-size:calc(var(--u)*25); line-height:1.25}
.fit .p{font-size:calc(var(--u)*20); color:var(--g3)}
.st{font:700 calc(var(--u)*19)/1 var(--f-title); letter-spacing:.1em; text-transform:uppercase; padding:calc(var(--u)*9) calc(var(--u)*14); white-space:nowrap}
.st.d{background:transparent; color:var(--blue); border:1.5px solid var(--blue)}
.st.s{background:transparent; color:var(--g3); border:1.5px solid var(--g2)}

/* Ruta */
.route{display:grid; grid-template-columns:repeat(8,1fr); margin-top:auto; position:relative}
.route::before{content:""; position:absolute; left:0; right:0; top:calc(var(--u)*36); height:4px; background:var(--g1)}
.route div{display:grid; gap:calc(var(--u)*14); justify-items:start; align-content:start; position:relative}
.route .dot{width:calc(var(--u)*76); height:calc(var(--u)*38); border-radius:calc(var(--u)*38) calc(var(--u)*38) 0 0; background:var(--g1); display:grid; place-items:end center; font:700 calc(var(--u)*24)/1 var(--f-title); color:var(--ink); padding-bottom:2px; box-sizing:border-box}
.route .base .dot{background:var(--cyan); color:var(--white)} .route .hit .dot{background:var(--blue); color:var(--white)}
.route .t{font:700 calc(var(--u)*25)/1.15 var(--f-title); padding-right:10px}
.route .hit .t{color:var(--blue)} .route .base .t{color:var(--cyan)}

/* Tablas */
.tbl{width:100%; border-collapse:collapse; font-size:calc(var(--u)*26)}
.tbl th{font:600 calc(var(--u)*19)/1 var(--f-title); letter-spacing:.18em; text-transform:uppercase; color:var(--g3); background:transparent; border-bottom:2px solid var(--blue); text-align:left; padding:calc(var(--u)*16) calc(var(--u)*20)}
.tbl td{padding:calc(var(--u)*13) calc(var(--u)*20); border-bottom:1px solid var(--g1); vertical-align:middle}
.tbl .num{font:500 calc(var(--u)*38)/1 var(--f-title); text-align:center}
.tbl th.num{text-align:center}
.tbl tr.snc td{background:var(--tint)}
.tbl tr.snc td:first-child{box-shadow:inset 8px 0 0 var(--cyan)}
.tbl tr.total td{background:var(--soft); font-weight:700; border-bottom:0}
.tbl .semc{font:700 calc(var(--u)*26)/1 var(--f-title); color:var(--blue); width:calc(var(--u)*90)}
.tbl .simn{font-weight:600; color:var(--blue); white-space:nowrap}
.tbl tr.snc .simn{color:var(--blue)}
.tbl.compact{font-size:calc(var(--u)*23)} .tbl.compact td{padding:calc(var(--u)*11) calc(var(--u)*16)}

.prog-top{display:flex; justify-content:space-between; align-items:flex-end; gap:24px}
.prog-nums{display:flex}
.prog-nums div{padding:0 calc(var(--u)*24); border-left:2px solid var(--g1); text-align:center}
.prog-nums div:first-child{border-left:0}
.prog-nums b{display:block; font:500 calc(var(--u)*50)/1 var(--f-title)}
.prog-nums span{font:600 calc(var(--u)*18)/1 var(--f-title); letter-spacing:.1em; text-transform:uppercase; color:var(--g3)}
.kind{display:flex; align-items:center; gap:14px; font:700 calc(var(--u)*24)/1 var(--f-title); letter-spacing:.08em; text-transform:uppercase}
.kind .st{font-size:calc(var(--u)*20)}
.cols2{display:grid; grid-template-columns:1fr 1fr; gap:calc(var(--u)*36)}
.gain{font-size:calc(var(--u)*25); font-style:italic; color:var(--g3); margin-top:calc(var(--u)*14); padding-left:calc(var(--u)*24); border-left:3px solid var(--cyan)}

/* Métodos de implementación */
.mgrid{display:grid; grid-template-columns:repeat(3,1fr); gap:calc(var(--u)*40); flex:1; align-content:center}
.mcard{display:flex; flex-direction:column; gap:calc(var(--u)*18); border-top:6px solid var(--mc); padding-top:calc(var(--u)*28)}
.mcard h3{font-size:calc(var(--u)*38); font-weight:600; line-height:1.1; color:var(--mc)}
.mq{font-size:calc(var(--u)*25); font-style:italic; line-height:1.4}
.md{font-size:calc(var(--u)*23); color:var(--g3)}
.mi{margin-top:calc(var(--u)*10); display:grid; gap:calc(var(--u)*8)}
.mi p{font-size:calc(var(--u)*23)}
.tl{display:grid; grid-template-columns:repeat(9,1fr); position:relative; height:calc(var(--u)*190); margin-block:calc(var(--u)*6)}
.tl::before{content:""; position:absolute; left:0; right:0; top:50%; height:4px; margin-top:-2px; background:var(--mc)}
.tl-i{position:relative; display:flex; justify-content:center}
.tl-n{position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); border-radius:50%; box-sizing:border-box}
.tl-i.w .tl-n{width:calc(var(--u)*34); height:calc(var(--u)*34); background:var(--white); border:4px solid var(--mc)}
.tl-i.a .tl-n{width:calc(var(--u)*50); height:calc(var(--u)*50); background:var(--mc); box-shadow:0 0 0 6px var(--white)}
.tl-l{position:absolute; left:50%; transform:translateX(-50%); width:calc(var(--u)*170); text-align:center; font:600 calc(var(--u)*19)/1.15 var(--f-title); letter-spacing:.1em; text-transform:uppercase; top:calc(50% + var(--u)*36)}
.tl-i.w .tl-l{color:var(--g3); letter-spacing:.04em; text-transform:none; font-size:calc(var(--u)*21)}
.tl-i.a .tl-l{color:var(--mc)}
.tl-i.up .tl-l{top:auto; bottom:calc(50% + var(--u)*36)}
.mfoot{display:grid; grid-template-columns:2fr 1fr; gap:calc(var(--u)*48); margin-top:calc(var(--u)*14); align-items:start}
.mfoot > div:first-child{display:grid; gap:calc(var(--u)*12)}
.feats{list-style:none; margin:0; padding:0; display:grid; border-top:1px solid var(--g2)}
.feats li{font-size:calc(var(--u)*23); line-height:1.35; padding:calc(var(--u)*9) 0 calc(var(--u)*9) calc(var(--u)*30); border-bottom:1px solid var(--g1); position:relative}
.feats li::before{content:""; position:absolute; left:0; top:calc(var(--u)*20); width:calc(var(--u)*12); height:calc(var(--u)*6); border-radius:calc(var(--u)*6) calc(var(--u)*6) 0 0; background:var(--cyan)}
.mideal{display:grid; gap:calc(var(--u)*12); padding:calc(var(--u)*24); background:var(--soft); border-left:4px solid var(--mc)}
.mideal p{font-size:calc(var(--u)*24); line-height:1.4}
/* Modelos */
.models{display:grid; grid-template-columns:repeat(3,1fr); gap:calc(var(--u)*28); flex:1}
.model{display:flex; flex-direction:column; gap:calc(var(--u)*16); border-top:1px solid var(--g2); padding-top:calc(var(--u)*24)}
.model:nth-child(2){border-color:var(--cyan)} .model:nth-child(3){border-color:var(--g2)}
.model .L{font:500 calc(var(--u)*110)/.9 var(--f-title); color:var(--blue)}
.model:nth-child(2) .L{color:var(--cyan)} .model:nth-child(3) .L{color:var(--g2)}
.model h3{font-size:calc(var(--u)*34); font-weight:600; line-height:1.15}
.model p{font-size:calc(var(--u)*24); color:var(--g3)}
.model dl{margin:auto 0 0; display:grid; grid-template-columns:auto 1fr; gap:calc(var(--u)*8) calc(var(--u)*16); font-size:calc(var(--u)*23)}
.model dt{font:700 calc(var(--u)*19)/1.6 var(--f-title); letter-spacing:.1em; text-transform:uppercase; color:var(--g3)}
.model dd{margin:0; font-weight:700}

.evgrid{display:grid; grid-template-columns:1fr 1fr; gap:0 calc(var(--u)*48); align-content:start}
.evgrid div{padding:calc(var(--u)*14) 0; border-bottom:1px solid var(--g1); font-size:calc(var(--u)*23); line-height:1.35}
.evgrid b{display:block; font:700 calc(var(--u)*25)/1.2 var(--f-title); color:var(--blue)}

.three{display:grid; grid-template-columns:repeat(3,1fr); gap:calc(var(--u)*20); margin-top:calc(var(--u)*14)}
.three div{padding:calc(var(--u)*30) 0 0; color:var(--ink); border-top:6px solid var(--bar); display:grid; gap:calc(var(--u)*16); align-content:start; min-height:calc(var(--u)*320); position:relative; overflow:hidden}
.three h3{font-size:calc(var(--u)*34); font-weight:600; line-height:1.15; color:var(--blue)}
.three p{color:var(--g3)}
.three p{font-size:calc(var(--u)*24)}

.s-end{background:var(--blue); color:var(--white)}
.end-in{flex:1; padding:calc(var(--u)*80) calc(var(--u)*90); display:flex; flex-direction:column; gap:calc(var(--u)*30); position:relative; z-index:1}
.end-in img{height:calc(var(--u)*130); width:auto; align-self:flex-start}
.end-in h2{font-size:calc(var(--u)*104); font-weight:600; line-height:1}
.end-in p{font-size:calc(var(--u)*30); max-width:28em}
.contacts{display:grid; grid-template-columns:1fr 1fr; gap:calc(var(--u)*24); margin-top:auto; max-width:calc(var(--u)*1100)}
.contact{border-top:3px solid var(--white); padding-top:calc(var(--u)*18); display:grid; gap:calc(var(--u)*8)}
.contact .kicker{color:var(--white)}
.contact a{color:var(--white); font-size:calc(var(--u)*26); font-weight:700; text-decoration:none; overflow-wrap:anywhere; user-select:all}
.contact a:hover{text-decoration:underline}

/* Controles */
.ctrl{transition:opacity .4s; position:fixed; left:50%; transform:translateX(-50%); bottom:calc(14px + env(safe-area-inset-bottom,0px)); z-index:5; display:flex; gap:4px; align-items:center; background:var(--white); padding:6px; box-shadow:0 6px 24px rgba(0,0,0,.18); font-family:var(--f-title)}
.ctrl button{all:unset; cursor:pointer; height:40px; min-width:40px; padding:0 12px; box-sizing:border-box; display:grid; place-items:center; font-weight:700; font-size:18px; color:var(--blue)}
.ctrl button:hover{background:var(--soft)}
.ctrl button:focus-visible{outline:3px solid var(--cyan)}
.ctrl output{font-weight:700; font-size:16px; letter-spacing:.08em; color:var(--g3); min-width:4.5em; text-align:center; font-variant-numeric:tabular-nums}
.bar{position:fixed; top:0; left:0; height:5px; background:var(--cyan); z-index:5; transition:width .3s}

/* Celular: diapositivas apiladas */
body.flow{overflow:auto; background:var(--white); --u:.6px}
body.flow .viewport{position:static; display:block}
body.flow .stage{width:auto; height:auto; transform:none !important}
body.flow .slide{position:relative; display:flex !important; flex-direction:column; animation:none; font-size:16px}
body.flow .rail{width:auto; padding:14px 16px; justify-content:flex-start}

const stage=document.getElementById("stage");
stage.innerHTML=S.map((h,i)=>h.replace("@@",String(i+1).padStart(2,"0"))).join("");
const slides=[...stage.querySelectorAll(".slide")];
const count=document.getElementById("count"), bar=document.getElementById("bar");
let cur=0;
function show(i){
 cur=Math.max(0,Math.min(slides.length-1,i));
 slides.forEach((s,k)=>s.classList.toggle("on",k===cur));
 count.textContent=`${cur+1} / ${slides.length}`;
 bar.style.width=((cur+1)/slides.length*100)+"%";
}
function fit(){
 const flow=innerWidth<820||innerHeight>innerWidth*1.1;
 document.body.classList.toggle("flow",flow);
 const k=Math.min(innerWidth/1840,innerHeight/1035);
 stage.style.width=flow?"":(innerWidth/k)+"px"; stage.style.height=flow?"":(innerHeight/k)+"px";
 stage.style.transform=flow?"":`scale(${k})`;
}
document.getElementById("prev").onclick=()=>show(cur-1);
document.getElementById("next").onclick=()=>show(cur+1);
document.getElementById("fs").onclick=()=>{try{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen().catch(()=>{})}catch(e){}};
addEventListener("keydown",e=>{
 if(document.body.classList.contains("flow"))return;
 if(["ArrowRight","PageDown"," "].includes(e.key)){e.preventDefault();show(cur+1)}
 if(["ArrowLeft","PageUp"].includes(e.key)){e.preventDefault();show(cur-1)}
 if(e.key==="Home")show(0); if(e.key==="End")show(slides.length-1);
});
stage.addEventListener("click",e=>{const g=e.target.closest("[data-go]");if(g){const k=slides.findIndex(s=>s.id===g.dataset.go);if(k>=0)show(k)}});
stage.addEventListener("keydown",e=>{const g=e.target.closest("[data-go]");if(g&&e.key==="Enter")g.click()});
let x0=null;
addEventListener("touchstart",e=>x0=e.touches[0].clientX,{passive:true});
addEventListener("touchend",e=>{if(x0===null||document.body.classList.contains("flow"))return;const dx=e.changedTouches[0].clientX-x0;if(Math.abs(dx)>50)show(cur+(dx<0?1:-1));x0=null});
addEventListener("resize",fit);
let idleT;const wake=()=>{document.body.classList.remove("idle");clearTimeout(idleT);idleT=setTimeout(()=>document.body.classList.add("idle"),2500)};
["mousemove","touchstart","keydown"].forEach(ev=>addEventListener(ev,wake,{passive:true}));wake();
fit(); show(0);
</script>
